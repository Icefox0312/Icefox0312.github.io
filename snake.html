<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game - Ad Free</title>
    <style>
        body { 
            background: #0d0f12; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        
        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .text-muted {
            color: #718096;
            margin-bottom: 20px;
        }

        /* Wraps tightly to prevent any border leaking */
        .game-container {
            position: relative;
            width: 600px;
            height: 600px;
            margin: 20px auto;
            border-radius: 8px;
            overflow: hidden; /* This hard-stops elements from rendering outside bounds */
            box-shadow: 0 0 25px rgba(0,255,102,0.2); 
        }

        canvas { 
            background: #14181f; 
            border: 4px solid #2d3748; 
            display: block; 
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* Game Over Screen Overlay - Fits flawlessly inside the container boundaries */
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 24, 31, 0.95); /* Matches canvas background color perfectly */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 4px solid #ff3333;
            box-sizing: border-box;
            border-radius: 8px;
            z-index: 10; /* Ensures it layers above the running canvas context */
        }

        #gameOverScreen h2 {
            color: #ff3333;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px rgba(255,51,51,0.6);
            letter-spacing: 2px;
        }

        #finalScore {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #e2e8f0;
        }

        .btn { 
            background: #00ff66; 
            color: #0d0f12; 
            border: none; 
            padding: 12px 24px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 6px; 
            text-decoration: none; 
            display: inline-block;
            font-size: 1.1rem;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { 
            background: #00cc52; 
            transform: scale(1.05);
        }

        .btn-restart {
            background: #ff3333;
            color: #fff;
        }

        .btn-restart:hover {
            background: #cc2424;
        }

        .score-board {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff66;
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(0,255,102,0.2);
        }
    </style>
</head>
<body>
    <h1>🐍 Retro Snake</h1>
    <p class="text-muted">Use Arrow Keys on your keyboard to turn. Eat the red food!</p>
    <a href="index.html" class="btn">Back to Hub</a>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="gameOverScreen">
            <h2>GAME OVER</h2>
            <div id="finalScore">Score: 0</div>
            <button class="btn btn-restart" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <div class="score-board">Score: <span id="currentScore">0</span></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const currentScoreDoc = document.getElementById("currentScore");
        const finalScoreDoc = document.getElementById("finalScore");
        
        const gridSize = 30;
        let snake, dx, dy, foodX, foodY, score, gameInterval;

        function initGame() {
            snake = [{x: 240, y: 240}, {x: 210, y: 240}, {x: 180, y: 240}];
            dx = gridSize;
            dy = 0;
            score = 0;
            currentScoreDoc.innerText = score;
            gameOverScreen.style.display = "none";
            createFood();
            nextTick();
        }

        function nextTick() {
            if (hasGameEnded()) {
                finalScoreDoc.innerText = `Final Score: ${score}`;
                gameOverScreen.style.display = "flex";
                return;
            }

            gameInterval = setTimeout(function onTick() {
                clearCanvas(); 
                drawFood(); 
                moveSnake(); 
                drawSnake(); 
                nextTick();
            }, 100);
        }

        function clearCanvas() { ctx.fillStyle = "#14181f"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        
        function drawSnake() { 
            ctx.fillStyle = '#00ff66'; 
            snake.forEach(part => ctx.fillRect(part.x, part.y, gridSize-2, gridSize-2));
