<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game - Ad Free</title>
    <style>
        body { 
            background: #0d0f12; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        
        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .text-muted {
            color: #718096;
            margin-bottom: 20px;
        }

        .controls-wrapper {
            margin-bottom: 20px;
        }

        /* Wraps tightly to prevent any border leaking */
        .game-container {
            position: relative;
            width: 600px;
            height: 600px;
            margin: 20px auto;
            border-radius: 8px;
            overflow: hidden; /* This hard-stops elements from rendering outside bounds */
            box-shadow: 0 0 25px rgba(0,255,102,0.2); 
            background: #14181f;
        }

        canvas { 
            background: #14181f; 
            border: 4px solid #2d3748; 
            display: block; 
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* Game Over Screen Overlay - Fits flawlessly inside the container boundaries */
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 24, 31, 0.95); /* Matches canvas background color perfectly */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 4px solid #ff3333;
            box-sizing: border-box;
            border-radius: 8px;
            z-index: 10; /* Ensures it layers above the running canvas context */
        }

        #gameOverScreen h2 {
            color: #ff3333;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px rgba(255,51,51,0.6);
            letter-spacing: 2px;
        }

        #finalScore {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #e2e8f0;
        }

        .btn { 
            background: #00ff66; 
            color: #0d0f12; 
            border: none; 
            padding: 12px 24px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 6px; 
            text-decoration: none; 
            display: inline-block;
            font-size: 1.1rem;
            margin: 0 5px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { 
            background: #00cc52; 
            transform: scale(1.05);
        }

        .btn-fullscreen {
            background: #171923;
            color: #00ff66;
            border: 2px solid #00ff66;
        }

        .btn-fullscreen:hover {
            background: #00ff66;
            color: #0d0f12;
        }

        .btn-restart {
            background: #ff3333;
            color: #fff;
        }

        .btn-restart:hover {
            background: #cc2424;
        }

        .score-board {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff66;
            margin-top: 15px;
            text-shadow: 0 0 10px rgba(0,255,102,0.2);
        }

        /* Fullscreen custom rules to keep it centered perfectly when triggered */
        :-webkit-full-screen .game-container {
            width: 90vh !important;
            height: 90vh !important;
            margin: 5vh auto !important;
        }
        :-ms-fullscreen .game-container {
            width: 90vh !important;
            height: 90vh !important;
            margin: 5vh auto !important;
        }
        :fullscreen .game-container {
            width: 90vh !important;
            height: 90vh !important;
            margin: 5vh auto !important;
        }
    </style>
</head>
<body>
    <h1>🐍 Retro Snake</h1>
    <p class="text-muted">Use Arrow Keys on your keyboard to turn. Eat the red food!</p>
    
    <div class="controls-wrapper">
        <a href="index.html" class="btn">Back to Hub</a>
        <button class="btn btn-fullscreen" onclick="toggleFullScreen()">Go Fullscreen 🖥️</button>
    </div>
    
    <div class="game-container" id="fullscreenArea">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="gameOverScreen">
            <h2>GAME OVER</h2>
            <div id="finalScore">Score: 0</div>
            <button class="btn btn-restart" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <div class="score-board">Score: <span id="currentScore">0</span></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const currentScoreDoc = document.getElementById("currentScore");
        const finalScoreDoc = document.getElementById("finalScore");
        
        const gridSize = 30;
        let snake, dx, dy, foodX, foodY, score, gameInterval;

        function initGame() {
            snake = [{x: 240, y: 240}, {x: 210, y: 240}, {x: 180, y: 240}];
            dx = gridSize;
            dy = 0;
            score = 0;
            currentScoreDoc.innerText = score;
            gameOverScreen.style.display = "none";
            createFood();
            nextTick();
        }

        function nextTick() {
            if (hasGameEnded()) {
                finalScoreDoc.innerText = `Final Score: ${score}`;
                gameOverScreen.style.display = "flex";
                return;
            }

            gameInterval = setTimeout(function onTick() {
                clearCanvas(); 
                drawFood(); 
                moveSnake(); 
                drawSnake(); 
                nextTick();
            }, 100);
        }

        function clearCanvas() { ctx.fillStyle = "#14181f"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        
        function drawSnake() { 
            ctx.fillStyle = '#00ff66'; 
            snake.forEach(part => ctx.fillRect(part.x, part.y, gridSize-2, gridSize-2)); 
        }
        
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (snake[0].x === foodX && snake[0].y === foodY) { 
                score += 10; 
                currentScoreDoc.innerText = score;
                createFood(); 
            } else { 
                snake.pop(); 
            }
        }
        
        function randomTen(min, max) { return Math.round((Math.random() * (max-min) + min) / gridSize) * gridSize; }
        function createFood() { foodX = randomTen(0, canvas.width - gridSize); foodY = randomTen(0, canvas.height - gridSize); }
        function drawFood() { ctx.fillStyle = '#ff3333'; ctx.fillRect(foodX, foodY, gridSize-2, gridSize-2); }
        
        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) { if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true; }
            return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
        }

        function resetGame() {
            clearTimeout(gameInterval);
            initGame();
        }

        // Native Fullscreen API Controller
        function toggleFullScreen() {
            const element = document.getElementById("fullscreenArea");
            if (!document.fullscreenElement) {
                if (element.requestFullscreen) element.requestFullscreen();
                else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
                else if (element.msRequestFullscreen) element.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Crucial fix: Stops arrow keys from scrolling the webpage entirely
        window.addEventListener("keydown", e => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key) > -1) {
                e.preventDefault();
            }
            
            if (e.key === "ArrowLeft" && dx === 0) { dx = -gridSize; dy = 0; }
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -gridSize; }
            if (e.key === "ArrowRight" && dx === 0) { dx = gridSize; dy = 0; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = gridSize; }
        }, {passive: false});

        initGame();
    </script>
</body>
</html>
