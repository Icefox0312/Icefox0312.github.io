<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game - True Black</title>
    <style>
        /* Pure OLED Black Aesthetic */
        body { 
            background: #000000; 
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        
        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .text-muted {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .controls-wrapper {
            margin-bottom: 20px;
        }

        /* Container box locked to exact canvas proportions */
        .game-container {
            position: relative;
            width: 600px;
            height: 600px;
            margin: 20px auto;
            border-radius: 8px;
            overflow: hidden; 
            border: 1px solid #1e293b;
            background: #000000;
        }

        canvas { 
            background: #000000; 
            display: block; 
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        /* Minimal White-on-Black Game Over Overlay */
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95); 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            border-radius: 8px;
            z-index: 10; 
        }

        #gameOverScreen h2 {
            color: #ffffff;
            font-size: 3rem;
            margin: 0 0 10px 0;
            font-weight: 700;
            letter-spacing: 2px;
        }

        #finalScore {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: #64748b;
        }

        /* Stark, crisp white/black functional buttons */
        .btn { 
            background: #ffffff; 
            color: #000000; 
            border: none; 
            padding: 10px 20px; 
            font-weight: 600; 
            cursor: pointer; 
            border-radius: 6px; 
            text-decoration: none; 
            display: inline-block;
            font-size: 1rem;
            margin: 0 5px;
            transition: background 0.15s ease;
        }

        .btn:hover { 
            background: #e2e8f0; 
        }

        .btn-fullscreen {
            background: #000000;
            color: #ffffff;
            border: 1px solid #1e293b;
        }

        .btn-fullscreen:hover {
            background: #1e293b;
            border-color: #475569;
        }

        .btn-restart {
            background: #ffffff;
            color: #000000;
        }
        
        .btn-restart:hover {
            background: #e2e8f0;
        }

        .score-board {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 15px;
        }

        /* Fullscreen handling */
        :fullscreen .game-container {
            width: 90vh !important;
            height: 90vh !important;
            margin: 5vh auto !important;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <h1>Retro Snake</h1>
    <p class="text-muted">Use Arrow Keys to change direction. Eat the targets.</p>
    
    <div class="controls-wrapper">
        <a href="index.html" class="btn">Back to Hub</a>
        <button class="btn btn-fullscreen" onclick="toggleFullScreen()">Fullscreen 🖥️</button>
    </div>
    
    <div class="game-container" id="fullscreenArea">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        
        <div id="gameOverScreen">
            <h2>GAME OVER</h2>
            <div id="finalScore">Score: 0</div>
            <button class="btn btn-restart" onclick="resetGame()">Try Again</button>
        </div>
    </div>

    <div class="score-board">Score: <span id="currentScore">0</span></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const currentScoreDoc = document.getElementById("currentScore");
        const finalScoreDoc = document.getElementById("finalScore");
        
        const gridSize = 30;
        let snake, dx, dy, foodX, foodY, score, gameInterval;

        function initGame() {
            snake = [{x: 240, y: 240}, {x: 210, y: 240}, {x: 180, y: 240}];
            dx = gridSize;
            dy = 0;
            score = 0;
            currentScoreDoc.innerText = score;
            gameOverScreen.style.display = "none";
            createFood();
            nextTick();
        }

        function nextTick() {
            if (hasGameEnded()) {
                finalScoreDoc.innerText = `Final Score: ${score}`;
                gameOverScreen.style.display = "flex";
                return;
            }

            gameInterval = setTimeout(function onTick() {
                clearCanvas(); 
                drawFood(); 
                moveSnake(); 
                drawSnake(); 
                nextTick();
            }, 100);
        }

        function clearCanvas() { ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        
        // Minimalist white snake structure
        function drawSnake() { 
            ctx.fillStyle = '#ffffff'; 
            snake.forEach(part => ctx.fillRect(part.x, part.y, gridSize-2, gridSize-2)); 
        }
        
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (snake[0].x === foodX && snake[0].y === foodY) { 
                score += 10; 
                currentScoreDoc.innerText = score;
                createFood(); 
            } else { 
                snake.pop(); 
            }
        }
        
        function randomTen(min, max) { return Math.round((Math.random() * (max-min) + min) / gridSize) * gridSize; }
        function createFood() { foodX = randomTen(0, canvas.width - gridSize); foodY = randomTen(0, canvas.height - gridSize); }
        
        // Slate gray functional target blocks
        function drawFood() { ctx.fillStyle = '#475569'; ctx.fillRect(foodX, foodY, gridSize-2, gridSize-2); }
        
        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) { if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true; }
            return snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height;
        }

        function resetGame() {
            clearTimeout(gameInterval);
            initGame();
        }

        function toggleFullScreen() {
            const element = document.getElementById("fullscreenArea");
            if (!document.fullscreenElement) {
                if (element.requestFullscreen) element.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Keeps browser scrolling fully disabled while playing
        window.addEventListener("keydown", e => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key) > -1) {
                e.preventDefault();
            }
            if (e.key === "ArrowLeft" && dx === 0) { dx = -gridSize; dy = 0; }
            if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -gridSize; }
            if (e.key === "ArrowRight" && dx === 0) { dx = gridSize; dy = 0; }
            if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = gridSize; }
        }, {passive: false});

        initGame();
    </script>
</body>
</html>
